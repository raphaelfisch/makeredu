<style>
:root{--bg:#F5F4F1;--surface:#FFF;--border:#E2E0DC;--text:#1A1A1A;--muted:#8A8680;--accent:#2E6E6B;--accent-dark:#255957;}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans',-apple-system,"Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;min-height:100dvh;font-size:14px;line-height:1.55}
.top{height:52px;background:#1A1A1A;color:#fff;display:flex;align-items:center;gap:10px;padding:0 24px}
.mark{width:28px;height:28px;background:#fff;color:#1A1A1A;border-radius:6px;display:grid;place-items:center;font-weight:700;font-size:13px}
.brand{font-weight:600;font-size:15px}
.wrap{max-width:620px;margin:40px auto;padding:0 16px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:24px;margin-bottom:16px}
h1{font-size:20px;margin-bottom:10px;letter-spacing:-.3px}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);margin-bottom:12px}
p{margin-bottom:10px}
ol{margin:0 0 10px 20px} li{margin-bottom:6px}
a{color:var(--accent)}
.btn{display:inline-block;padding:10px 18px;border-radius:6px;border:1px solid var(--accent);background:var(--accent);color:#fff;font:inherit;font-weight:500;text-decoration:none;cursor:pointer}
.btn:hover{background:var(--accent-dark)}
.btn.sec{background:var(--surface);color:var(--text);border-color:var(--border)}
.proj{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid var(--border)}
.proj:first-child{border-top:none}
.muted{color:var(--muted);font-size:12.5px}
code{background:var(--bg);padding:1px 5px;border-radius:4px;font-size:13px}
</style>
</head>
<body>
<div class="top"><div class="mark">M</div><span class="brand">MakerEdu</span></div>
